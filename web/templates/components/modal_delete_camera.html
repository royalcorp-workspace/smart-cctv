<!-- MODAL: DELETE / DEACTIVATE CAMERA -->
<div id="deleteCameraModal" class="video-modal-backdrop" style="display: none;">
  <div class="modal-dialog modal-dialog-sm form-modal-dialog">
    <div class="modal-header danger-header">
      <div class="modal-title-wrap">
        <span class="badge-modal-danger">PERINGATAN KEAMANAN</span>
        <h3>Hapus / Nonaktifkan Kamera</h3>
      </div>
      <button type="button" class="btn-close-modal" onclick="closeDeleteCameraModal()" aria-label="Tutup Modal">&times;</button>
    </div>

    <div class="modal-body form-modal-body">
      <p class="del-confirm-text">
        Apakah Anda yakin ingin menonaktifkan kamera <strong id="delCamNameDisplay">cam_01</strong>?
      </p>
      <div class="del-warning-box">
        <span class="warn-icon">⚠️</span>
        <div>
          Pipeline stream akan dihentikan secara aman dan folder kamera akan diarsipkan. Data riwayat rekaman insiden tetap disimpan.
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div></div>
      <div class="modal-footer-actions">
        <button type="button" class="btn-control btn-secondary" onclick="closeDeleteCameraModal()">Batal</button>
        <button type="button" id="btnConfirmDeleteCam" class="btn-control btn-danger" onclick="confirmDeleteCamera()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span>Ya, Nonaktifkan Kamera</span>
        </button>
      </div>
    </div>
  </div>
</div>
