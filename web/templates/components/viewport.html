<!-- LEFT: VIDEO STREAM VIEWPORT (16:9) & INTERACTIVE CANVAS -->
<section class="video-container-section">
  <div class="video-card" id="videoContainer">
    <!-- DEDICATED CARD HEADER (NEVER COLLIDES WITH CAMERA OSD) -->
    <div class="video-card-header">
      <div class="video-header-left">
        <div class="live-indicator">
          <span class="live-dot"></span>
          <span class="live-text">LIVE</span>
        </div>
        <div class="video-cam-meta">
          <span class="video-cam-id" id="badgeCamId">cam_01</span>
          <span class="video-meta-sep">&bull;</span>
          <span class="video-cam-name" id="badgeCamName">Koridor Utama</span>
        </div>
      </div>
    </div>

    <!-- VIDEO FRAME INNER (UNOBSTRUCTED 16:9 FEED) -->
    <div class="video-frame-inner">
      <img id="streamFeed" src="/video_feed/cam_01{% if api_key %}?api_key={{ api_key }}{% endif %}" alt="CCTV Stream Feed" />

      {% if is_admin %}
      <!-- INTERACTIVE ZONE & TRIPWIRE EDITOR CANVAS (NATIVE 1920x1080) -->
      <canvas id="zoneEditorCanvas" width="1920" height="1080"></canvas>
      {% endif %}
    </div>

    {% if is_admin %}
    <!-- FLOATING ENTERPRISE GLASSMORPHISM CALIBRATION BAR -->
    <div class="zone-glass-toolbar" id="zoneToolbar" style="display: none;">
      <!-- Category Switcher: Poligon Zona vs Garis Tripwire -->
      <div class="glass-category-tabs">
        <button type="button" id="tabPolygons" class="glass-tab active" onclick="switchEditorCategory('polygons')" title="Edit Zona Poligon (Dwell Time)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>Poligon</span>
        </button>
        <button type="button" id="tabTripwires" class="glass-tab" onclick="switchEditorCategory('tripwires')" title="Edit Garis Tripwire (Tripwire Crossings)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Tripwire</span>
        </button>
      </div>

      <div class="glass-divider"></div>

      <!-- Item Selector with Indicator Dot & Quick Actions -->
      <div class="glass-zone-select-wrap">
        <span class="glass-zone-dot" id="zoneColorDot"></span>
        <select id="zoneSelector" class="glass-select" onchange="onZoneSelectChange()" title="Pilih Elemen untuk Diedit">
          <!-- Populated dynamically -->
        </select>
        <button type="button" class="glass-btn glass-btn-subtle" onclick="openAddElementPrompt()" data-tooltip="Tambah Elemen Baru (+)" aria-label="Tambah Elemen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button type="button" class="glass-btn glass-btn-subtle btn-del-elem" onclick="promptDeleteZoneConfirm()" data-tooltip="Hapus Elemen Terpilih" aria-label="Hapus Elemen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>

      <div class="glass-divider"></div>

      <!-- Drawing Tool Actions (Compact Micro-Icons with Hover Tooltips) -->
      <div class="glass-tool-group">
        <button type="button" id="btnModeDrag" class="glass-btn active" onclick="setZoneMode('drag')" data-tooltip="Mode Geser / Pilih Titik" aria-label="Geser Titik">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
        </button>
        <button type="button" id="btnModeAdd" class="glass-btn" onclick="setZoneMode('add')" data-tooltip="Mode Tambah Titik Vertex Baru" aria-label="Tambah Titik">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </button>
        <button type="button" id="btnDeleteSelected" class="glass-btn" onclick="deleteSelectedPoint()" data-tooltip="Hapus Titik (Del / Klik Kanan pada Titik)" aria-label="Hapus Titik">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button type="button" id="btnUndo" class="glass-btn" onclick="undoZoneAction()" data-tooltip="Urungkan Perubahan (Ctrl+Z)" aria-label="Undo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button type="button" id="btnResetZone" class="glass-btn" onclick="resetCurrentZone()" data-tooltip="Kembalikan ke Titik Awal" aria-label="Reset">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
        <button type="button" id="btnZoneProperties" class="glass-btn" onclick="togglePropertiesDrawer()" data-tooltip="Atur Properti (Nama, Dwell Time, Arah)" aria-label="Properti">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button type="button" id="btnZoneGuide" class="glass-btn" onclick="openCalibrationGuide()" data-tooltip="Panduan (?)" aria-label="Bantuan Panduan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </div>

      <div class="glass-divider"></div>

      <!-- Status / Telemetry Badge (Compact) -->
      <div class="glass-status-wrap">
        <span class="glass-validation-pill valid" id="zoneValidationPill">Valid</span>
      </div>

      <div class="glass-divider"></div>

      <!-- Right: Save & Close Buttons -->
      <div class="glass-action-group">
        <button type="button" id="btnSaveZones" class="glass-btn-save" onclick="saveZonesToServer()" data-tooltip="Simpan & Terapkan (Atomic Hot-Reload)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Simpan</span>
        </button>
        <button type="button" class="glass-btn-close" onclick="toggleZoneEditor(false)" title="Tutup Mode Kalibrasi (Esc)" aria-label="Tutup Kalibrasi">
          &times;
        </button>
      </div>
    </div>

    <!-- DRAWER: ELEMENT PROPERTIES (DOCKED OVER ACTIVE CAMERA VIEWPORT) -->
    <div id="zonePropertiesDrawer" class="properties-drawer" style="display: none;">
      <div class="drawer-header">
        <div class="drawer-title-wrap">
          <span class="drawer-dot" id="drawerElemDot"></span>
          <h4 id="drawerElemTitle">Properti Elemen</h4>
        </div>
        <button type="button" class="btn-close-drawer" onclick="togglePropertiesDrawer(false)">&times;</button>
      </div>

      <div class="drawer-body">
        <!-- PROPERTIES FOR POLYGON ZONES -->
        <div id="propsPolygonSection">
          <div class="form-group mb-3">
            <label for="propZoneName" class="form-label">Nama Zona Area</label>
            <input type="text" id="propZoneName" class="form-input" placeholder="Zebra Cross / Area Antrean" oninput="updateCurrentElemMeta()" />
          </div>

          <div class="form-group mb-3">
            <label for="propZoneDwell" class="form-label">Batas Waktu Dwell (Detik)</label>
            <div class="input-with-addon">
              <input type="number" id="propZoneDwell" class="form-input" min="5" max="86400" value="60" oninput="updateCurrentElemMeta()" />
              <span class="input-addon">detik</span>
            </div>
            <span class="form-help" id="propZoneDwellHelp">60 detik = 1 menit. Melebihi batas ini akan memicu alarm.</span>
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Target Kelas Pelanggaran</label>
            <div class="checkbox-group">
              <label class="checkbox-label"><input type="checkbox" id="propZoneClassTruck" value="truck" checked onchange="updateCurrentElemMeta()" /> Truk</label>
              <label class="checkbox-label"><input type="checkbox" id="propZoneClassBus" value="bus" checked onchange="updateCurrentElemMeta()" /> Bus</label>
              <label class="checkbox-label"><input type="checkbox" id="propZoneClassCar" value="car" checked onchange="updateCurrentElemMeta()" /> Mobil</label>
              <label class="checkbox-label"><input type="checkbox" id="propZoneClassPerson" value="person" onchange="updateCurrentElemMeta()" /> Orang</label>
            </div>
          </div>
        </div>

        <!-- PROPERTIES FOR TRIPWIRE LINES -->
        <div id="propsTripwireSection" style="display: none;">
          <div class="form-group mb-3">
            <label for="propLineName" class="form-label">Nama Garis Virtual</label>
            <input type="text" id="propLineName" class="form-input" placeholder="Tripwire 1" oninput="updateCurrentElemMeta()" />
          </div>

          <div class="form-group mb-3">
            <label for="propLineDirection" class="form-label">Arah Penyeberangan (Direction)</label>
            <select id="propLineDirection" class="form-select" onchange="updateCurrentElemMeta()">
              <option value="both">Dua Arah (A ⇄ B / Bolak-Balik)</option>
              <option value="a_to_b">Satu Arah: Dari A ke B (Sesuai Panah)</option>
              <option value="b_to_a">Satu Arah: Dari B ke A (Lawan Panah)</option>
            </select>
            <span class="form-help">Titik P1 adalah titik A, titik P2 adalah titik B.</span>
          </div>

          <div class="form-group mb-3">
            <label class="form-label">Target Kelas yang Memicu Tripwire</label>
            <div class="checkbox-group">
              <label class="checkbox-label"><input type="checkbox" id="propLineClassPerson" value="person" checked onchange="updateCurrentElemMeta()" /> Pejalan Kaki (Person)</label>
              <label class="checkbox-label"><input type="checkbox" id="propLineClassTruck" value="truck" onchange="updateCurrentElemMeta()" /> Truk</label>
              <label class="checkbox-label"><input type="checkbox" id="propLineClassBus" value="bus" onchange="updateCurrentElemMeta()" /> Bus</label>
              <label class="checkbox-label"><input type="checkbox" id="propLineClassCar" value="car" onchange="updateCurrentElemMeta()" /> Mobil</label>
            </div>
          </div>
        </div>
      </div>

      <div class="drawer-footer">
        <button type="button" class="btn-drawer-close-action" onclick="togglePropertiesDrawer(false)">Tutup Properti</button>
      </div>
    </div>
    {% endif %}
  </div>
</section>
