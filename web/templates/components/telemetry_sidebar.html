<!-- RIGHT: REAL-TIME TELEMETRY & VMS CLEAN DUAL-CARD SIDEBAR -->
<aside class="telemetry-sidebar" id="telemetrySidebar">
  <!-- CARD 1: RTSP STREAM STATUS & PERFORMANCE -->
  <div class="panel-card">
    <div class="panel-card-header">
      <div class="panel-card-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2"></circle>
          <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path>
        </svg>
        <span>Status Stream & RTSP</span>
      </div>
      <span class="status-badge connected" id="pillRtspStatus">Connected</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi-box">
        <span class="kpi-label">PIPELINE FPS</span>
        <span class="kpi-value" id="statFps">--</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">OBJEK TERLACAK</span>
        <span class="kpi-value" id="statTracks">0</span>
      </div>
    </div>
  </div>

  <!-- CARD 2: CLEAR AREA MONITORING -->
  <div class="panel-card">
    <div class="panel-card-header">
      <div class="panel-card-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Pelanggaran Clear Area</span>
      </div>
      <span class="status-badge connected" id="pillViolations">Aman</span>
    </div>
    <div class="kpi-grid">
      <div class="kpi-box">
        <span class="kpi-label">PELANGGARAN AKTIF</span>
        <span class="kpi-value alert-text" id="statViolations">0</span>
      </div>
      <div class="kpi-box">
        <span class="kpi-label">ALERT TELEGRAM</span>
        <span class="kpi-value success-text" id="statTelegram">Siap</span>
      </div>
    </div>
  </div>

  <!-- Backward-Compatibility Anchors (hidden from view) -->
  <div id="sidebarZoneList" style="display: none;"></div>
  <div id="quickEventTicker" style="display: none;"></div>
  <span id="faceCount" style="display: none;"></span>
  <div id="quickCamSwitcher" style="display: none;"></div>
  <span id="quickCamCount" style="display: none;"></span>
  <div id="facesList" style="display: none;"></div>
</aside>
