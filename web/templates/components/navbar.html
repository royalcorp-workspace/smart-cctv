<!-- TOP NAVIGATION BAR -->
<header class="navbar">
  <div class="navbar-left">
    <div class="brand">
      <span class="brand-title">SMART CCTV 2.0</span>
      <span class="brand-badge">Enterprise v2.0</span>
    </div>

    <div class="camera-select-container">
      <label for="cameraSelect" class="sr-only">Pilih Kamera</label>
      <div class="select-wrapper">
        <svg class="select-camera-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 7l-7 5 7 5V7z"></path>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <select id="cameraSelect" class="camera-select" onchange="onCameraChange()">
          {% if cameras and cameras|length > 0 %}
            {% for cam in cameras %}
            <option value="{{ cam.id }}" {% if loop.first %}selected{% endif %}>
              {{ cam.id }} ({{ cam.name }})
            </option>
            {% endfor %}
          {% else %}
            <option value="cam_01">cam_01 (Koridor Utama)</option>
            <option value="cam_02">cam_02 (Area Parkir POS-2)</option>
            <option value="cam_03">cam_03 (Jalur Logistik Arah POS-1)</option>
            <option value="cam_04">cam_04 (Area Timbangan Truk)</option>
          {% endif %}
        </select>
        <svg class="select-chevron" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>
  </div>

  <div class="navbar-right">
    <!-- DIGITAL CLOCK (WIB) -->
    <div class="clock-display" id="systemClock">--:--:-- WIB</div>

    <!-- THEME TOGGLE BUTTON -->
    <button id="themeToggle" class="btn-icon" onclick="toggleTheme()" title="Ganti Tema (Gelap / Terang)" aria-label="Ganti Tema">
      <!-- Sun Icon (Shown in Dark Mode) -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon Icon (Shown in Light Mode) -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- FULLSCREEN BUTTON -->
    <button class="btn-control" onclick="toggleFullscreen()" title="Layar Penuh Viewport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 2 2h3"></path>
      </svg>
      <span>Layar Penuh</span>
    </button>

    <!-- ADD CAMERA BUTTON -->
    <button class="btn-control btn-add-cam" id="btnAddCamera" onclick="openAddCameraModal()" title="Tambah Kamera CCTV Baru (Auto .env & Folder)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span>Tambah Kamera</span>
    </button>

    <!-- DELETE CAMERA BUTTON (ACTIVE CAMERA) -->
    <button class="btn-control btn-del-cam" id="btnDeleteCamera" onclick="openDeleteCameraModal()" title="Hapus / Nonaktifkan Kamera Aktif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span>Hapus</span>
    </button>

    <!-- ZONE CALIBRATION BUTTON -->
    <button class="btn-control btn-calibrate" id="btnToggleEditor" onclick="toggleZoneEditor()" title="Kalibrasi & Edit Poligon Zona ROI Interaktif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>Kalibrasi Zona</span>
    </button>
  </div>
</header>
