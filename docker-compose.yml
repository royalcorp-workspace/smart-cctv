services:
  smart-cctv:
    build: .
    container_name: smart-cctv-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./cameras:/app/cameras
      - ./data:/app/data
      - ./storage:/app/storage
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/cameras || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
