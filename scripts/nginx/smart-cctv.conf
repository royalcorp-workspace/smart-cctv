# ==============================================================================
# Smart CCTV 2.0 - Nginx Reverse Proxy & SSL Configuration
# Production Virtual Host Configuration for Host Server (172.16.2.185)
# ==============================================================================

# Map connection header for WebSocket / SSE support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Server Block (Port 80) - Automatic Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 172.16.2.185 localhost _;

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Let's Encrypt ACME challenge (if public domain is configured)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# 2. HTTPS Server Block (Port 443) - Secure TLS & Zero-Latency CCTV Streaming
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 172.16.2.185 localhost _;

    # SSL / TLS Certificate paths
    ssl_certificate /etc/ssl/certs/smart-cctv.crt;
    ssl_certificate_key /etc/ssl/private/smart-cctv.key;

    # Modern TLS Protocols and High-Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload & Body Limit (Snapshots, ONNX Models, Zone Polygons)
    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # SPECIALIZED CCTV LIVE STREAMING LOCATION BLOCKS
    # Crucial tuning: Disable buffering and extend timeout for continuous MJPEG
    # --------------------------------------------------------------------------
    location ~ ^/(video_feed|api/stream)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Disable all proxy buffering to eliminate streaming lag / latency
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        tcp_nodelay on;

        # Keep streaming connection alive indefinitely (24 hours) without timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Forward real client identity and scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # STATIC ASSETS CACHING (CSS, JS, ICONS)
    # --------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --------------------------------------------------------------------------
    # GENERAL WEB DASHBOARD & REST API LOCATION BLOCK
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket and Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
